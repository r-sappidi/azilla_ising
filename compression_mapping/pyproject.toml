[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azilla-compression-mapping"
version = "0.1.0"
description = "Graph partitioning, block compression, lossy pruning, and NoC mapping for Azilla"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_mapping*", "azilla_integration*"]
